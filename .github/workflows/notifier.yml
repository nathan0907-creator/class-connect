# Notifications, messages programmés, rappels et résumé du matin, sans PC allumé : un court passage toutes les 5 minutes.
# Gratuit (dépôt public). Aucune clé secrète : Google reconnaît ce dépôt (fédération d'identité, branche main uniquement).
name: Notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: notifier
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/595535956311/locations/global/workloadIdentityPools/github/providers/class-connect
          service_account: firebase-adminsdk-fbsvc@class-connectv3.iam.gserviceaccount.com
      - run: npm ci --omit=dev
        working-directory: server
      - run: node cron.mjs
        working-directory: server
