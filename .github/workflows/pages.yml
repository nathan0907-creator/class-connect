# Publie le dossier public/ sur GitHub Pages à chaque push sur main.
# Dans le dépôt : Settings > Pages > Source : « GitHub Actions ».
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regrouper et compresser (un seul fichier JavaScript, CSS minifié)
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.25.12
          node scripts/optimize.mjs
      - name: Versionner les fichiers (évite les anciens fichiers en cache)
        run: node scripts/cache-bust.mjs "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
